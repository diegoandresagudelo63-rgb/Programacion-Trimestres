<!DOCTYPE html>
<html>
<head>
    <title>Crear Pedido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <!-- Título -->
    <h1 class="text-center mb-4 fw-bold text-success">➕ Crear Nuevo Pedido</h1>

    <!-- Tarjeta -->
    <div class="card shadow-lg border-0 rounded-4 mx-auto" style="max-width: 600px;">
        <div class="card-body p-4">

            <form method="post">
                {% csrf_token %}

                <!-- Formulario -->
                <div class="mb-3">
                    {{ form.as_p }}
                </div>

                <!-- Botones -->
                <div class="d-flex justify-content-between mt-4">
                    <a href="{% url 'listar_pedidos' %}" class="btn btn-outline-secondary rounded-pill px-4">
                        ⬅ Volver
                    </a>

                    <button type="submit" class="btn btn-success rounded-pill px-4">
                        💾 Guardar Pedido
                    </button>
                </div>

            </form>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
