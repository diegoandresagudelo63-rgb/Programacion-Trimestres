<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block titulo %}Gestión de Pedidos{% endblock %}</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- SweetAlert2 para confirmaciones bonitas -->
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Menú de navegación -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'listar_pedidos' %}"> Gestión de Pedidos</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link text-white" href="{% url 'listar_clientes' %}">👥 Clientes</a>
            <a class="nav-link text-white" href="{% url 'listar_productos' %}">🛒 Productos</a>
            <a class="nav-link text-white" href="{% url 'listar_pedidos' %}">📋 Pedidos</a>
        </div>
        <!-- Muestra el usuario logueado y botón de cerrar sesión -->
        <div class="navbar-nav ms-3">
            <span class="nav-link text-white-50">👤 {{ request.session.username }}</span>
            <a class="nav-link text-warning" href="{% url 'logout' %}">🚪 Salir</a>
        </div>
    </div>
</nav>

<div class="container">

    <!-- Mensajes del sistema (éxito, error, etc.) -->
    {% for msg in messages %}
    <div class="alert alert-{{ msg.tags }} alert-dismissible fade show" role="alert">
        {{ msg }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {% endfor %}

    {% block contenido %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

{% block scripts %}{% endblock %}
</body>
</html>
