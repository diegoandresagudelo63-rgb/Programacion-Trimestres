<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card { width: 100%; max-width: 400px; border-radius: 12px; }
    </style>
</head>
<body>

<div class="card shadow-lg">
    <div class="card-body p-4">
        <h4 class="text-center mb-1 fw-bold text-primary"> Gestión de Pedidos</h4>
        <p class="text-center text-muted mb-4">Inicia sesión para continuar</p>

        <!-- Formulario de login — envía usuario y contraseña a la vista login_view -->
        <form method="post" id="loginForm">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-bold">Usuario</label>
                <input type="text" name="username" class="form-control" placeholder="Tu usuario" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Contraseña</label>
                <input type="password" name="password" class="form-control" placeholder="Tu contraseña" required>
            </div>

            <!-- Mensaje de error si las credenciales son incorrectas -->
            {% if error %}
            <div class="alert alert-danger py-2 text-center">{{ error }}</div>
            {% endif %}

            <button type="submit" class="btn btn-primary w-100 mt-2">Ingresar</button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    // Si hay error de credenciales, SweetAlert2 lo muestra también
    {% if error %}
    Swal.fire({
        icon: 'error',
        title: 'Acceso denegado',
        text: '{{ error }}',
        confirmButtonText: 'Intentar de nuevo'
    });
    {% endif %}
</script>
</body>
</html>
